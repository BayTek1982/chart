  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- feines Raster -->
  <g stroke="#ffffff" stroke-opacity=".06" stroke-width="3">
    <line x1="64" y1="160" x2="448" y2="160"/><line x1="64" y1="256" x2="448" y2="256"/><line x1="64" y1="352" x2="448" y2="352"/>
  </g>
  <!-- Kerzen -->
  <g stroke-linecap="round">
    <line x1="140" y1="250" x2="140" y2="420" stroke="#ff6b5e" stroke-width="12"/>
    <rect x="114" y="280" width="52" height="100" rx="10" fill="#ff6b5e"/>
    <line x1="224" y1="210" x2="224" y2="390" stroke="#3ccf8a" stroke-width="12"/>
    <rect x="198" y="240" width="52" height="118" rx="10" fill="#3ccf8a"/>
    <line x1="308" y1="160" x2="308" y2="330" stroke="#3ccf8a" stroke-width="12"/>
    <rect x="282" y="186" width="52" height="112" rx="10" fill="#3ccf8a"/>
