// Börsen: OKX Perpetual (USDT-SWAP, wie „OKX:…USDT.P“ in TradingView) und Binance Spot

// OKX liefert max. 300 Kerzen (aktuell) bzw. 100 (Historie) je Abruf → mehrere Abrufe parallel, versetzt gestartet
async function okxK(sym,tf,limit,endTime){const id=sym+"-USDT-SWAP",bar=OKXB[tf],st=KSTEP[tf],U="https://www.okx.com/api/v5/market/";let out=[],t0;
  if(!endTime){const j=await getJSON(`${U}candles?instId=${id}&bar=${bar}&limit=300`);if(j.code!=="0"||!j.data||!j.data.length)return[];out=j.data.map(okxRow);t0=Math.min(...out.map(x=>x.t))}
  else t0=endTime+1;
  const need=Math.max(0,Math.ceil((limit-out.length)/100)),reqs=[];
  for(let q=0;q<need;q++)reqs.push(wait(q*110).then(()=>getJSON(`${U}history-candles?instId=${id}&bar=${bar}&limit=100&after=${t0-q*100*st}`,15000)).then(j=>j&&j.code==="0"?(j.data||[]).map(okxRow):[]).catch(()=>[]));
  for(const a of await Promise.all(reqs))out=out.concat(a);
  const m=new Map();out.forEach(x=>m.set(x.t,x));return[...m.values()].sort((a,b)=>a.t-b.t).slice(-limit)}
async function binK(sym,tf,limit,endTime){const j=await getJSON(`https://data-api.binance.vision/api/v3/klines?symbol=${sym}USDT&interval=${tf}&limit=${Math.min(1000,limit)}${endTime?"&endTime="+endTime:""}`,15000);
  return Array.isArray(j)?j.map(r=>({t:+r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5],b:+r[9]})):[]}

function kFetch(sym,tf,limit,endTime){return S.src==="OKX Perp"?okxK(sym,tf,Math.min(limit,600),endTime):binK(sym,tf,limit,endTime)}
async function loadList(){

    S.list.k=(j.data||[]).filter(x=>/-USDT-SWAP$/.test(x.instId)).map(x=>({s:x.instId.slice(0,-10),n:"Perp",v:+x.volCcy24h*+x.last})).sort((a,b)=>b.v-a.v)}catch(e){}
  if(S.ex!=="okx"||!S.list.k.length)try{const t=await getJSON("https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI");
    S.list.k=t.filter(x=>/USDT$/.test(x.symbol)&&+x.closeTime>Date.now()-2*864e5).map(x=>({s:x.symbol.slice(0,-4),n:"",v:+x.quoteVolume})).filter(x=>!/^(USDC|FDUSD|TUSD|USDP|DAI|EUR|BUSD|USD1)$/.test(x.s)).sort((a,b)=>b.v-a.v)}catch(e){}
  try{const j=await getJSON(RAW+"gz_1d.json?t="+Math.floor(Date.now()/36e5),40000);S.list.a=(j.items||[]).map(x=>({s:x.y,n:x.n,c:x.c}))}catch(e){}}
async function klines(){const s=S.sym,tf=S.tf;
  if(S.mkt==="k"){const order=S.ex==="okx"?["okx","bin"]:["bin","okx"];
    for(const x of order){try{const k=x==="okx"?await okxK(s,tf,1000):await binK(s,tf,1000);if(k.length)return{src:x==="okx"?"OKX Perp":"Binance",k}}catch(e){}}
    throw new Error(`${s}/USDT wurde bei OKX (Perpetual) und Binance nicht gefunden.`)}
  const j=await getJSON(RAW+"c/"+s.replace(/[^A-Za-z0-9.\-]/g,"_")+".json?t="+Math.floor(Date.now()/3e5));
  const rows=j[tf]||[];if(!rows.length)throw new Error(`Keine ${TFLAB[tf]}-Daten für ${s}.`);
  return{src:"Yahoo (stündlich)",k:rows.map(r=>({t:r[0],o:r[1],h:r[2],l:r[3],c:r[4],v:r[5]||0}))}}
// ---------- Risiko & Hitze (Daten aus dem Coin-Scanner, täglich per GitHub Actions) ----------
const HB=()=>Math.floor(Date.now()/36e5);let RIDX=null,SRIDX=null;const LONG={};
const dayOf=t=>Math.floor(t/864e5),wkDay=d=>d-((d+3)%7);
function rkScale(x,R){const r=x>=0?(R.mx>0?.5+.5*x/R.mx:1):(R.mn<0?.5-.5*x/R.mn:0);return Math.max(0,Math.min(1,r))}
function rkAt(R,p){const M=R.M,x=(Math.log(p)-Math.log((R.s+p)/M.L))*(R.n||1)**(M.a||0);return rkScale(x,R)}
function rkPrice(R,r){const M=R.M,k=(r>=.5?(2*r-1)*R.mx:(1-2*r)*R.mn)/(R.n||1)**(M.a||0);let lo=Math.log(1e-12),hi=Math.log(1e12);
  for(let i=0;i<120;i++){const m=(lo+hi)/2;(m-Math.log((R.s+Math.exp(m))/M.L)<k)?lo=m:hi=m}return Math.exp(lo)}
async function longData(){const key=S.mkt+":"+S.sym;if(LONG[key])return LONG[key];let out={e:[],R:null,th:null,wc:null};
  if(S.mkt==="k"){if(RIDX===null)RIDX=await getJSON("https://scanner.kompassapps.de/data/risk.json?t="+HB()).catch(()=>false);
    const R=RIDX&&RIDX.coins&&RIDX.coins[S.sym];
    if(R&&R.last_day>=dayOf(Date.now())-5){R.M={L:RIDX.model.L,a:RIDX.model.a||0};out.R=R;
      try{const j=await getJSON(`https://scanner.kompassapps.de/data/risk/${encodeURIComponent(S.sym)}.json?t=${HB()}`);out.e=j.d.map(x=>({d:x[0],p:x[1],r:x[2]}))}catch(e){}}
    if(!out.e.length){try{const j=await getJSON(`https://data-api.binance.vision/api/v3/klines?symbol=${S.sym}USDT&interval=1d&limit=1000`);out.e=j.map(r=>({d:dayOf(+r[0]),p:+r[4],r:null}))}catch(e){}}
    // Hitze aus Tageskursen: Kurs ÷ ((19 abgeschlossene Wochen-Schlusskurse + Kurs) / 20)
    const W=new Map();out.e.forEach(x=>W.set(wkDay(x.d),x.p));const wks=[...W.keys()].sort((a,b)=>a-b);out.wc=wks.map(w=>[w,W.get(w)]);
    let wi=0;const closes=[];out.e.forEach(x=>{const w=wkDay(x.d);while(wi<wks.length&&wks[wi]<w){closes.push(W.get(wks[wi]));wi++}
      if(closes.length>=19){const s=closes.slice(-19).reduce((a,b)=>a+b,0);x.h=x.p/((s+x.p)/20)}else x.h=null})}
  else{if(SRIDX===null)SRIDX=await getJSON("https://scanner.kompassapps.de/data/srisk.json?t="+HB()).catch(()=>false);
    const R=SRIDX&&SRIDX.s&&SRIDX.s[S.sym];if(R){if(R.s!=null&&R.ld>=dayOf(Date.now())-8){R.M={L:SRIDX.model.L,a:0};out.R=R}out.th=R.th||null;out.wc=R.wc||null}
    try{const j=await getJSON(`https://scanner.kompassapps.de/data/srisk/${encodeURIComponent(S.sym.replace(/[^A-Za-z0-9.\-]/g,"_"))}.json?t=${HB()}`);out.e=j.d.map(x=>({d:x[0],p:x[1],r:x[2],h:x[3]}))}catch(e){}}
  return LONG[key]=out}
function buildExt(L){const k=S.k,n=k.length;if(!n||!L.e.length)return null;const e=L.e;
  const at=d=>{let a=0,b=e.length-1,r=-1;while(a<=b){const m=(a+b)>>1;if(e[m].d<=d){r=m;a=m+1}else b=m-1}return r};
  const risk=new Array(n).fill(null),heat=new Array(n).fill(null);
  for(let i=0;i<n;i++){const j=at(dayOf(k[i].t));if(j<0)continue;const x=e[j];if(dayOf(k[i].t)-x.d>10)continue;risk[i]=x.r;heat[i]=x.h??null}
  const p=S.kO[n-1].c,F=S.F,ext={heatTh:L.th};
  if(L.R){ext.riskNow=rkAt(L.R,p);risk[n-1]=ext.riskNow}
  if(L.wc){const wk=wkDay(dayOf(Date.now()));const done=L.wc.filter(w=>w[0]<wk).slice(-19);if(done.length===19){const s=done.reduce((a,w)=>a+w[1],0);ext.heatAvg=(s+p)/20*F;ext.heatNow=p*F/ext.heatAvg;heat[n-1]=ext.heatNow}}
  if(risk.some(v=>v!=null))ext.risk=risk;if(heat.some(v=>v!=null))ext.heat=heat;heatCalc(ext);
  if(L.R&&ext.riskNow!=null){const rs=e.map(x=>x.r).filter(v=>v!=null),tot=rs.length||1,rows=[];
    for(let q=0;q<=10;q++){const r=q/10,z=rs.filter(v=>q===10?v>=0.995:v>=r&&v<r+0.1).length/tot*100;rows.push({r,p:rkPrice(L.R,r)*F,z})}
    const cur=ext.riskNow,below=rows.filter(w=>w.r<=cur).slice(-3),above=rows.filter(w=>w.r>cur).slice(0,2);
    ext.riskTab=[...below,{r:cur,p:p*F,cur:true},...above]}
  return ext}
async function refreshExt(){if(!(S.cfg.risk.on||S.cfg.heat.on)||!S.k.length){S.ext=null;return}
  try{S.ext=buildExt(await longData())}catch(e){S.ext=null}}

const CCY={"$":"USD","€":"EUR","HK$":"HKD","¥":"JPY","₩":"KRW","£":"GBP","CHF":"CHF","":"USD"};
const SFX={DE:"€",PA:"€",AS:"€",BR:"€",MI:"€",MC:"€",HE:"€",HK:"HK$",T:"¥",KS:"₩",L:"£",SW:"CHF"};
function ccyOf(){if(S.mkt==="k")return"$";const it=S.list.a.find(x=>x.s===S.sym);if(it&&it.c!=null)return it.c||"$";

function sugList(q){const Q=norm(q),out=[];if(!Q)return out;const seen=new Set();
  const score=(sym,name)=>{const S0=norm(sym),N=norm(name);if(S0===Q)return 0;if(N===Q)return 1;if(N.startsWith(Q))return 2;if(S0.startsWith(Q))return 3;if(N.includes(Q))return 4;return 9};
  S.list.k.forEach((x,i)=>{const n=CNAME[x.s]||GECKO[x.s]||"",sc=score(x.s,n);if(sc<9){out.push({s:x.s,m:"k",n:n||"Krypto",sc,r:i});seen.add("k"+x.s)}});
  S.list.a.forEach((x,i)=>{const sc=score(x.s.replace(/\..*$/,""),x.n);if(sc<9)out.push({s:x.s,m:"a",n:x.n||"Aktie / Index",sc,r:5000+i})});
  return out.sort((a,b)=>a.sc-b.sc||a.r-b.r).slice(0,30)}
function showSug(){const q=$("sym").value.trim();if(!q){$("sug").hidden=true;return}const m=sugList(q);sugI=m.length?0:-1;
  $("sug").innerHTML=m.length?m.map((x,i)=>`<button data-s="${esc(x.s)}" data-m="${x.m}" class="${i===0?"on":""}"><b>${x.m==="k"&&window.wlFlag&&wlFlag(x.s)?`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${wlFlag(x.s)};margin-right:6px"></i>`:""}${esc(x.s)}${x.m==="k"?"<small>/USDT</small>":""}</b><small>${esc(x.n)}${x.m==="a"?" · Aktie":""}</small></button>`).join(""):`<div class="sugE">Suche „${esc(q)}“ …</div>`;
  $("sug").hidden=false;
  // Namenssuche (z. B. „Bitcoin“) über CoinGecko, nur Coins, die es an der Börse gibt
  const Q=norm(q);if(Q.length>=3&&Q!==geQ){clearTimeout(geT);geT=setTimeout(async()=>{geQ=Q;try{const j=await getJSON("https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(q),8000);
    const have=new Set(S.list.k.map(x=>x.s));let add=0;for(const c of(j.coins||[]).slice(0,25)){const sy=String(c.symbol||"").toUpperCase();if(have.has(sy)&&!CNAME[sy]&&!GECKO[sy]){GECKO[sy]=c.name;add++}}
    if(add&&document.activeElement===$("sym"))showSug();else if(!sugList(q).length&&document.activeElement===$("sym"))$("sug").innerHTML=`<div class="sugE">Nichts gefunden</div>`}catch(e){}},300)}}

$("sym").addEventListener("keydown",e=>{const bs=[...$("sug").querySelectorAll("button")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sugI=Math.max(0,Math.min(bs.length-1,sugI+(e.key==="ArrowDown"?1:-1)));bs.forEach((b,i)=>b.classList.toggle("on",i===sugI))}
  if(e.key==="Enter"){e.preventDefault();const b=sugI>=0&&bs[sugI]?bs[sugI]:bs[0];if(b)pick(b.dataset.s,b.dataset.m);else{const v=$("sym").value.trim().replace(/\/?USDT(\.P)?$/i,"").replace(/^[A-Z]+:/i,"");if(v)pick(v,"k")}}
  if(e.key==="Escape")$("sug").hidden=true});
